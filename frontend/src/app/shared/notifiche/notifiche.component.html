<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080">
  @for (notifica of notifiche(); track notifica.id) {
    <div
      class="toast show align-items-center border-0"
      [class.text-bg-success]="notifica.tipo === 'successo'"
      [class.text-bg-danger]="notifica.tipo === 'errore'"
      role="alert"
    >
      <div class="d-flex">
        <div class="toast-body">{{ notifica.messaggio }}</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Chiudi"
          (click)="chiudi(notifica.id)"
        ></button>
      </div>
    </div>
  }
</div>
