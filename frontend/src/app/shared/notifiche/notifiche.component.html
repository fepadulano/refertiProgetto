<div class="notifiche-container">
  @for (notifica of notifiche(); track notifica.id) {
    <div
      class="notifica"
      [class.notifica-successo]="notifica.tipo === 'successo'"
      [class.notifica-errore]="notifica.tipo === 'errore'"
      role="alert"
    >
      <span class="notifica-testo">{{ notifica.messaggio }}</span>
      <button
        type="button"
        class="notifica-chiudi"
        aria-label="Chiudi"
        (click)="chiudi(notifica.id)"
      >×</button>
    </div>
  }
</div>
